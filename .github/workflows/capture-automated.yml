name: Capture TikTok Invite Traffic (Automated)

on:
  workflow_dispatch:
    inputs:
      invite_url:
        description: 'TikTok Lite invite URL'
        required: false
        default: 'https://lite.tiktok.com/t/ZS9y8Hn4KXRgV-6TKv1/'

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      FRIDA_VERSION: "16.5.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch APK
        run: |
          git fetch origin claude/new-session-c9gvpt
          git checkout origin/claude/new-session-c9gvpt -- apk/clean_patched.apk
          ls -lh apk/

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y android-tools-adb
          pip install mitmproxy "frida==${FRIDA_VERSION}" frida-tools
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz" \
            -O frida-server.xz
          xz -d frida-server.xz
          mv frida-server-${FRIDA_VERSION}-android-arm64 frida-server 2>/dev/null || mv frida-server-*-android-arm64 frida-server 2>/dev/null || true
          chmod +x frida-server
          ls -lh frida-server
          frida --version

      - name: Generate mitmproxy cert
        run: |
          mitmdump --no-server &
          sleep 4; kill %1 2>/dev/null || true
          CERT_HASH=$(openssl x509 -inform PEM -subject_hash_old \
            -in ~/.mitmproxy/mitmproxy-ca-cert.pem | head -1)
          cp ~/.mitmproxy/mitmproxy-ca-cert.pem "${CERT_HASH}.0"
          echo "CERT_HASH=$CERT_HASH" >> $GITHUB_ENV
          echo "CERT_FILE=${CERT_HASH}.0" >> $GITHUB_ENV
          echo "Cert hash: $CERT_HASH"

      - name: Load binder + start Redroid
        run: |
          if ! sudo modprobe binder_linux num_threads=256 2>/dev/null; then
            sudo apt-get install -y linux-modules-extra-$(uname -r)
            sudo modprobe binder_linux num_threads=256
          fi
          sudo modprobe ashmem_linux 2>/dev/null || true
          lsmod | grep binder

          docker run -d --privileged --name redroid11 \
            -v "$HOME/redroid-data:/data" \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=redroid androidboot.use_memfd=true
          docker ps

      - name: Load NAT kernel modules
        run: |
          echo "=== kernel ==="
          uname -r
          sudo modprobe nf_conntrack && echo "nf_conntrack: OK" || echo "nf_conntrack: FAILED"
          sudo modprobe nf_nat && echo "nf_nat: OK" || echo "nf_nat: FAILED"
          sudo modprobe iptable_nat && echo "iptable_nat: OK" || echo "iptable_nat: FAILED"
          sudo modprobe xt_REDIRECT && echo "xt_REDIRECT: OK" || echo "xt_REDIRECT: FAILED"
          lsmod | grep -E 'nat|conntrack|redirect' || echo "(none matched)"

          sudo update-alternatives --set iptables /usr/sbin/iptables-legacy
          iptables --version
          sudo iptables -t nat -L -n && echo "nat table: OK" || echo "nat table: FAILED"

      - name: Wait for Android boot
        run: |
          sleep 5
          adb connect localhost:5555
          sleep 3
          for i in $(seq 1 60); do
            boot=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "  boot check $i: '$boot'"
            [ "$boot" = "1" ] && break
            sleep 5
          done
          adb -s localhost:5555 shell getprop sys.boot_completed

      - name: Setup device
        run: |
          adb -s localhost:5555 root || true
          sleep 3
          adb disconnect localhost:5555 || true
          sleep 1
          for i in $(seq 1 30); do
            adb connect localhost:5555 2>/dev/null || true
            state=$(adb -s localhost:5555 get-state 2>/dev/null | tr -d '\r')
            echo "  reconnect $i: '$state'"
            [ "$state" = "device" ] && break
            sleep 1
          done
          echo "Final adb state: $(adb -s localhost:5555 get-state 2>/dev/null || echo unknown)"

          echo "=== Set device locale to Japan (bypass US geo-restriction) ==="
          adb -s localhost:5555 shell setprop persist.sys.locale ja-JP || true
          adb -s localhost:5555 shell setprop persist.sys.timezone Asia/Tokyo || true
          echo "Restarting Android framework for locale change..."
          adb -s localhost:5555 shell stop || true
          sleep 10
          adb -s localhost:5555 shell start || true
          sleep 20
          for i in $(seq 1 40); do
            boot=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "  locale-boot check $i: '$boot'"
            [ "$boot" = "1" ] && break
            sleep 3
          done
          adb disconnect localhost:5555 || true
          sleep 2
          for i in $(seq 1 20); do
            adb connect localhost:5555 2>/dev/null || true
            state=$(adb -s localhost:5555 get-state 2>/dev/null | tr -d '\r')
            [ "$state" = "device" ] && break
            sleep 2
          done
          adb -s localhost:5555 root || true
          sleep 3
          adb disconnect localhost:5555 || true
          sleep 1
          for i in $(seq 1 15); do
            adb connect localhost:5555 2>/dev/null || true
            state=$(adb -s localhost:5555 get-state 2>/dev/null | tr -d '\r')
            [ "$state" = "device" ] && break
            sleep 2
          done
          echo "Locale: $(adb -s localhost:5555 shell getprop persist.sys.locale 2>/dev/null)"
          echo "Timezone: $(adb -s localhost:5555 shell getprop persist.sys.timezone 2>/dev/null)"

          adb -s localhost:5555 shell iptables -A OUTPUT -p udp --dport 443 -j DROP || true
          echo "QUIC block attempted"

          adb -s localhost:5555 shell mkdir -p /data/misc/user/0/cacerts-added || true
          adb -s localhost:5555 push "${CERT_FILE}" "/data/misc/user/0/cacerts-added/${CERT_FILE}" \
            && echo "CERT PUSH: PASS" || echo "CERT PUSH: FAIL"
          adb -s localhost:5555 shell chmod 644 "/data/misc/user/0/cacerts-added/${CERT_FILE}" || true

          adb -s localhost:5555 push frida-server /data/local/tmp/frida-server \
            && echo "FRIDA PUSH: PASS" || echo "FRIDA PUSH: FAIL"
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/frida-server || true
          adb -s localhost:5555 shell /data/local/tmp/frida-server &
          sleep 3
          adb -s localhost:5555 shell ps -A 2>/dev/null | grep -i frida || echo "frida-server: not in ps"

          adb -s localhost:5555 install -r apk/clean_patched.apk \
            && echo "APK INSTALLED" || echo "APK INSTALL FAILED (continuing)"

          echo "=== TikTok Lite intent filters (dumpsys package) ==="
          adb -s localhost:5555 shell "timeout 25 dumpsys package com.zhiliaoapp.musically.go 2>/dev/null" \
            > pm_dump_full.txt 2>/dev/null || true
          echo "pm_dump_full.txt: $(wc -l < pm_dump_full.txt 2>/dev/null || echo 0) lines"
          grep -E 'snssdk|aweme|roma|browser|webview|Scheme:|Host:|Path:|mActivities|ACTION_VIEW|BROWSABLE' \
            pm_dump_full.txt | head -400 || echo "(dumpsys grep empty)"

          echo "=== Force App Link routing to TikTok Lite ==="
          adb -s localhost:5555 shell pm set-app-link com.zhiliaoapp.musically.go always \
            && echo "set-app-link always: OK" || echo "set-app-link always: failed (expected on API 30)"
          adb -s localhost:5555 shell pm set-app-links --package com.zhiliaoapp.musically.go 0 all \
            && echo "set-app-links 0 all: OK" || echo "set-app-links 0 all: failed (OK)"
          adb -s localhost:5555 shell pm get-app-links com.zhiliaoapp.musically.go 2>/dev/null \
            || adb -s localhost:5555 shell pm get-app-link com.zhiliaoapp.musically.go 2>/dev/null \
            || echo "get-app-link: not available"

      - name: Setup transparent proxy
        run: |
          ANDROID_IP=$(docker inspect redroid11 --format '{{.NetworkSettings.IPAddress}}')
          echo "Android container IP: $ANDROID_IP"
          echo "ANDROID_IP=$ANDROID_IP" >> $GITHUB_ENV

          sudo iptables -t nat -A PREROUTING -s "$ANDROID_IP" -p tcp --dport 443 -j REDIRECT --to-port 8080
          sudo iptables -t nat -A PREROUTING -s "$ANDROID_IP" -p tcp --dport 80  -j REDIRECT --to-port 8080
          sudo iptables -t nat -L PREROUTING -n
          echo "iptables PREROUTING rules set"

          mitmdump --mode transparent \
            --ssl-insecure \
            --listen-port 8080 \
            --set flow_detail=1 \
            -w traffic.mitm \
            > mitmdump.log 2>&1 &
          echo "MITM_PID=$!" >> $GITHUB_ENV
          sleep 3
          echo "mitmdump started"
          cat mitmdump.log || true

      - name: Spawn TikTok Lite + inject Frida
        run: |
          python3 frida-scripts/spawn-inject.py > frida.log 2>&1 &
          echo "FRIDA_PID=$!" >> $GITHUB_ENV
          echo "Frida spawning TikTok Lite, waiting 20s for app to init..."
          sleep 20

          echo "=== Early Frida log ==="
          cat frida.log || true

      - name: Open invite URL + deeplink + accept
        run: |
          INVITE_URL="${{ github.event.inputs.invite_url }}"
          echo "Opening: $INVITE_URL"
          # BROWSABLE category required for App Link matching; package name at end (not --package)
          adb -s localhost:5555 shell am start -W \
            -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$INVITE_URL" \
            com.zhiliaoapp.musically.go \
            && echo "am start: OK" || echo "am start: failed (continuing)"

          echo "Waiting 40s for WebView to render invite page..."
          sleep 40

          echo "=== UI dump 1 (WebView invite page) ==="
          adb -s localhost:5555 shell uiautomator dump /sdcard/ui_dump.xml 2>&1 || true
          adb -s localhost:5555 pull /sdcard/ui_dump.xml ui_dump.xml 2>/dev/null \
            && echo "ui_dump.xml pulled" || echo "ui_dump pull failed"

          echo "=== Phase 1: extract snssdk deeplink ==="
          python3 scripts/tap-ui.py ui_dump.xml || true

          echo "Waiting 20s for TikTok Lite reward screen..."
          sleep 20

          echo "=== UI dump 2 (TikTok Lite reward screen) ==="
          adb -s localhost:5555 shell uiautomator dump /sdcard/ui_dump2.xml 2>&1 || true
          adb -s localhost:5555 pull /sdcard/ui_dump2.xml ui_dump2.xml 2>/dev/null \
            && echo "ui_dump2.xml pulled" || echo "ui_dump2 pull failed"

          echo "=== Phase 2: tap accept button in TikTok Lite ==="
          python3 scripts/tap-ui.py ui_dump2.xml || true

          echo "Waiting 30s for API call after accept tap..."
          sleep 30

          echo "Capture window done"

      - name: Stop capture + dump results
        if: always()
        run: |
          kill $FRIDA_PID 2>/dev/null || true
          kill $MITM_PID 2>/dev/null || pkill -f mitmdump || true
          sleep 2

          echo "=== traffic.mitm size ==="
          ls -lh traffic.mitm 2>/dev/null || echo "(no file)"

          echo "=== Full traffic dump -> traffic.txt (silent) ==="
          python3 scripts/dump-traffic.py traffic.mitm > traffic.txt 2>&1 \
            && echo "dump OK: $(wc -l < traffic.txt) lines" \
            || echo "(dump failed)"

          echo "=== Frida log ==="
          cat frida.log || true

          echo "=== mitmdump log (last 50 lines) ==="
          tail -50 mitmdump.log || true

          echo "=== logcat TKL_UCODE ==="
          timeout 10 adb -s localhost:5555 logcat -d -s TKL_UCODE 2>/dev/null || true

          echo "=== logcat TIKTOK_SSL ==="
          timeout 10 adb -s localhost:5555 logcat -d -s TIKTOK_SSL_PINNING_BYPASS 2>/dev/null || true

          echo "=== UI dump 1 (all text nodes) ==="
          python3 scripts/dump-ui.py ui_dump.xml 2>/dev/null || echo "(no ui_dump.xml)"

          echo "=== UI dump 2 (all text nodes) ==="
          python3 scripts/dump-ui.py ui_dump2.xml 2>/dev/null || echo "(no ui_dump2.xml)"

          echo "=== Key traffic paths ==="
          grep -aE '(KEY|incentive|mentor|invite|referral|pro_scan|linker|passport|ZS9y8|device_register|webid|roma_redirect)' traffic.txt \
            | head -200 || echo "(no key paths matched)"

          echo "=== passport/account/info response (full block) ==="
          grep -a -A 60 'passport/account/info' traffic.txt | head -150 || echo "(not found)"

          echo "=== device_register response (full block) ==="
          grep -a -A 40 'device_register' traffic.txt | head -100 || echo "(not found)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-traffic-${{ github.run_number }}
          path: |
            traffic.mitm
            traffic.txt
            frida.log
            mitmdump.log
            ui_dump.xml
            ui_dump2.xml
            pm_dump_full.txt
          retention-days: 7
