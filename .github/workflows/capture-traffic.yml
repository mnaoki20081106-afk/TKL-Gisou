name: TKL Traffic Capture

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'APK path in repo'
        default: 'apk/clean_patched.apk'
        required: false
  push:
    branches: [ claude/new-session-c9gvpt ]

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch APK from feature branch
        run: |
          git fetch origin claude/new-session-c9gvpt
          git checkout origin/claude/new-session-c9gvpt -- apk/clean_patched.apk
          ls -lh apk/

      - name: Enable KVM (best-effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm && echo "KVM available" || echo "KVM not available - will use TCG"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mitmproxy
        run: |
          pip install mitmproxy
          mitmdump --no-server &
          sleep 4
          kill %1 2>/dev/null || true
          ls ~/.mitmproxy/
          CERT_HASH=$(openssl x509 -inform PEM -subject_hash_old \
            -in ~/.mitmproxy/mitmproxy-ca-cert.pem | head -1)
          cp ~/.mitmproxy/mitmproxy-ca-cert.pem "${CERT_HASH}.0"
          echo "CERT_HASH=$CERT_HASH" >> $GITHUB_ENV
          echo "CERT_FILE=${CERT_HASH}.0" >> $GITHUB_ENV
          echo "CA cert hash: $CERT_HASH"

      - name: Install frida-tools + download frida-server
        run: |
          pip install frida-tools
          FRIDA_VERSION=$(python3 -c "import frida; print(frida.__version__)")
          echo "FRIDA_VERSION=$FRIDA_VERSION" >> $GITHUB_ENV
          echo "Frida version: $FRIDA_VERSION"
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz" \
            -O frida-server.xz
          xz -d frida-server.xz
          mv frida-server-*-android-arm64 frida-server || true
          ls -lh frida-server

      - name: Install Android cmdline-tools
        run: |
          CMDLINE_TOOLS_VERSION=15859902
          CMDLINE_TOOLS_SHA256=4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            -O cmdline-tools.zip
          echo "${CMDLINE_TOOLS_SHA256}  cmdline-tools.zip" | sha256sum -c
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install AVD system image (api-30 google_apis arm64)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;google_apis;arm64-v8a"

      - name: Create AVD
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            --name "capture_avd" \
            --package "system-images;android-30;google_apis;arm64-v8a" \
            --device "pixel_4" \
            --force

      - name: Capture traffic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          avd-name: capture_avd
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -http-proxy http://127.0.0.1:8080
          disable-animations: true
          script: |
            set -e
            echo "=== Emulator ready ==="
            adb devices

            echo "=== adb root ==="
            adb root
            sleep 2

            echo "=== Block QUIC (UDP 443) to force TCP/TLS ==="
            adb shell iptables -A OUTPUT -p udp --dport 443 -j DROP || echo "iptables QUIC block failed (non-fatal)"

            echo "=== Install mitmproxy CA cert as user cert ==="
            adb shell mkdir -p /data/misc/user/0/cacerts-added
            adb push "${CERT_FILE}" "/data/misc/user/0/cacerts-added/${CERT_FILE}"
            adb shell chmod 644 "/data/misc/user/0/cacerts-added/${CERT_FILE}"
            adb shell ls -la /data/misc/user/0/cacerts-added/ | grep "${CERT_HASH}" || true

            echo "=== Push + start frida-server ==="
            adb push frida-server /data/local/tmp/frida-server
            adb shell chmod 755 /data/local/tmp/frida-server
            adb shell "nohup /data/local/tmp/frida-server > /dev/null 2>&1 &"
            sleep 3
            adb shell ps -A 2>/dev/null | grep frida-server || echo "frida-server not found in ps"

            echo "=== Start mitmdump (background) ==="
            mitmdump -w traffic.mitm --set ssl_insecure=true 2>mitmdump_stderr.txt &
            MITM_PID=$!
            sleep 2

            echo "=== Install patched APK ==="
            adb install -r "apk/clean_patched.apk" && echo "INSTALL_OK" || echo "INSTALL_FAIL"

            echo "=== Clear logcat ==="
            adb logcat -c

            echo "=== Spawn app with Frida SSL bypass ==="
            frida -U -f com.zhiliaoapp.musically.go -l frida-scripts/tiktok-ssl-bypass.js > frida_output.txt 2>&1 &
            FRIDA_PID=$!
            sleep 5

            echo "=== Open invite URL ==="
            adb shell am start -a android.intent.action.VIEW -d "https://lite.tiktok.com/t/ZS9y8Hn4KXRgV-6TKv1/"
            sleep 30

            echo "=== TKL_UCODE in logcat ==="
            adb logcat -d | grep "TKL_UCODE" || echo "TKL_UCODE not found"

            echo "=== TIKTOK_SSL_PINNING_BYPASS in logcat ==="
            adb logcat -d | grep "TIKTOK_SSL_PINNING_BYPASS" | tail -20 || echo "bypass tag not found"

            echo "=== Save logcat ==="
            adb logcat -d -t 500 > logcat_full.txt

            echo "=== Stop frida + mitmdump ==="
            kill $FRIDA_PID 2>/dev/null || true
            kill $MITM_PID 2>/dev/null || true
            sleep 2
            ls -lh traffic.mitm frida_output.txt || echo "output files missing"

      - name: Parse mitmproxy traffic to JSON
        if: always()
        run: |
          cat > parse_traffic.py << 'PYEOF'
          import json, sys, os

          output = []
          if not os.path.exists("traffic.mitm"):
              print("traffic.mitm not found")
              json.dump([], open("parsed_requests.json", "w"))
              sys.exit(0)

          try:
              from mitmproxy import io as mio
              from mitmproxy.http import HTTPFlow

              with open("traffic.mitm", "rb") as f:
                  reader = mio.FlowReader(f)
                  for flow in reader.stream():
                      if not isinstance(flow, HTTPFlow):
                          continue
                      req = flow.request
                      resp = flow.response

                      def safe_text(data, max_bytes=4096):
                          if data is None:
                              return None
                          try:
                              return data[:max_bytes].decode("utf-8", errors="replace")
                          except Exception:
                              return data[:max_bytes].hex()

                      entry = {
                          "url": req.pretty_url,
                          "method": req.method,
                          "request_headers": dict(req.headers),
                          "request_body": safe_text(req.content),
                          "response_status": resp.status_code if resp else None,
                          "response_headers": dict(resp.headers) if resp else {},
                          "response_body": safe_text(resp.content) if resp else None,
                      }
                      output.append(entry)

          except Exception as e:
              output = [{"error": str(e)}]

          with open("parsed_requests.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Parsed {len(output)} flows")
          hosts = sorted(set(e.get("url","").split("/")[2] for e in output if "url" in e))
          print("Hosts seen:")
          for h in hosts:
              print(f"  {h}")
          PYEOF
          python3 parse_traffic.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-capture
          path: |
            parsed_requests.json
            traffic.mitm
            logcat_full.txt
            mitmdump_stderr.txt
            frida_output.txt
