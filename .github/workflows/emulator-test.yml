name: TKL Emulator Test

on:
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install emulator + system image
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/ || true
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install required components
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis_playstore;x86_64"

      - name: Create AVD
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            --name "test_avd" \
            --package "system-images;android-34;google_apis_playstore;x86_64" \
            --device "pixel_6" \
            --force
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd

      - name: Start emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          avd-name: test_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "=== Emulator booted ==="
            adb devices

            echo "=== Install patched APK ==="
            adb install -r apk/clean_patched.apk && echo "INSTALL_OK" || echo "INSTALL_FAIL"

            echo "=== Clear logcat ==="
            adb logcat -c

            echo "=== Open invite URL ==="
            adb shell am start \
              -a android.intent.action.VIEW \
              -d "https://lite.tiktok.com/t/ZS9y8Hn4KXRgV-6TKv1/" || true
            sleep 20

            echo "=== TKL_UCODE in logcat ==="
            adb logcat -d | grep "TKL_UCODE" || echo "TKL_UCODE not found"

            echo "=== Full logcat ==="
            adb logcat -d -t 300 > logcat_full.txt
            cat logcat_full.txt

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat_full.txt
